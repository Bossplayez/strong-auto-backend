[deploy]
# Keep Prisma's generated client and the current database schema in lockstep.
# `migrate deploy` is additive/idempotent: it applies tracked migrations only
# and never resets or recreates the production database.
startCommand = "npx prisma migrate deploy && npm run start:prod"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
internalPort = 3000
